apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-native-app
spec:
  replicas: 3
  template:
    spec:
      containers:
      - name: app
        image: sua-imagem-native:latest
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        ports:
        - containerPort: 8080